[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pasko-agent-society"
version = "0.1.0"
description = "A synthetic laboratory for reproducible collective AI-agent behavior research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Pasko Labs" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
pasko-agent-society = "pasko_agent_society.cli:main"
pasko-agent-society-gate11 = "pasko_agent_society.gate11_cli:main"

[tool.setuptools.packages.find]
include = ["pasko_agent_society*"]
