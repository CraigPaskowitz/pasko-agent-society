name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate1:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q pasko_agent_society tests scripts
      - name: Unit and invariant tests
        run: python -m unittest discover -s tests -v
      - name: Safety and privacy scan
        run: python scripts/safety_scan.py
      - name: Gate 1.1 compact result evidence
        run: |
          if [ -d results/gate1_1 ]; then
            python scripts/validate_gate11_result.py
          fi
      - name: Whitespace check
        run: git diff --check
